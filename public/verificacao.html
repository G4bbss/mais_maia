<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Verificação - Rede de Apoio Materno</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(to right, #f5ebe0, #e6ccb2);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a3c31;
    }
    .container {
      background: #fffaf6;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h2 { color: #7f5539; margin-bottom: 15px; }
    p { font-size: 14px; margin-bottom: 20px; color: #4a3c31; }
    .code-inputs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .code-inputs input {
      width: 40px;
      height: 50px;
      font-size: 22px;
      text-align: center;
      border: 1px solid #d9c5b2;
      border-radius: 8px;
      background-color: #f5ebe0;
      color: #4a3c31;
    }
    input[type="submit"], button {
      background-color: #7f5539;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      padding: 12px;
      border: none;
      border-radius: 5px;
      width: 100%;
      transition: background-color 0.3s;
    }
    input[type="submit"]:hover, button:hover { background-color: #9c6644; }
    .resend { margin-top: 15px; font-size: 13px; }
    .resend button:disabled { background-color: #d9c5b2; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Verificação de Dois Fatores</h2>
    <p>Insira o código de verificação enviado para o seu e-mail.</p>
 
    <form id="formVerificacao">
      <input type="hidden" id="emailHidden" name="email">
     
      <div class="code-inputs">
        <input type="text" maxlength="1" required class="code-field">
        <input type="text" maxlength="1" required class="code-field">
        <input type="text" maxlength="1" required class="code-field">
        <input type="text" maxlength="1" required class="code-field">
        <input type="text" maxlength="1" required class="code-field">
        <input type="text" maxlength="1" required class="code-field">
      </div>
      <input type="submit" value="Confirmar">
    </form>
 
    <div class="resend">
      <button id="resendBtn" disabled>Reenviar código</button>
      <p id="timerText">Você poderá reenviar em 60s</p>
    </div>
  </div>
 
  <script>
    // Pega o e-mail da URL (?email=...)
    const params = new URLSearchParams(window.location.search);
    const emailParam = params.get('email');
    if (emailParam) {
      document.getElementById('emailHidden').value = emailParam;
    }
 
    // Navegação automática entre os campos de texto
    const inputs = document.querySelectorAll('.code-field');
    inputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        if (input.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });
 
    // Envio assíncrono para validação
    document.getElementById('formVerificacao').addEventListener('submit', async (e) => {
      e.preventDefault();
     
      const codigo = Array.from(inputs).map(i => i.value).join('');
      const email = document.getElementById('emailHidden').value;
 
      try {
        const response = await fetch('/cliente/verificar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, codigoDigitado: codigo })
        });
 
        const data = await response.json();
        if (response.ok && data.ok) {
          alert(data.mensagem);
          // Redireciona diretamente para o Dashboard após validar
          window.location.href = '/dashboard';
        } else {
          alert(data.erro || 'Código incorreto');
        }
      } catch (err) {
        alert('Erro ao se comunicar com o servidor.');
      }
    });
 
    // Temporizador do Reenvio
    let timer = 60;
    const resendBtn = document.getElementById("resendBtn");
    const timerText = document.getElementById("timerText");
 
    const countdown = setInterval(() => {
      timer--;
      timerText.textContent = `Você poderá reenviar em ${timer}s`;
      if (timer <= 0) {
        clearInterval(countdown);
        resendBtn.disabled = false;
        timerText.textContent = "";
      }
    }, 1000);
  </script>
</body>
</html>
