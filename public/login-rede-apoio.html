<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Rede de Apoio - Maia</title>
    <link rel="icon" href="img/maiaFavicon.png" type="image/png">
    <link rel="stylesheet" href="style/login.css">
</head>

<body>
    <!-- Container principal -->
    <div class="container">

        <!-- Painel esquerdo com mensagem para voluntários/apoiadores -->
        <div class="left-panel">
            <h1>Bem-vinda, apoiadora!</h1>
            <p>Obrigada por fazer parte da nossa rede. Sua ajuda transforma o pós-parto e a vida de diversas mães e bebês.</p>
        </div>

        <!-- Painel direito com formulário -->
        <div class="right-panel">
            <div class="login-box">
                <h2>Login Rede de Apoio</h2>

                <!-- Formulário de login -->
                <form id="formLogin">
                    <input type="email" id="email" name="Email" placeholder="Endereço de e-mail" required>
                    <input type="password" id="senha" name="Senha" placeholder="Senha" required>

                    <!-- Opções extras -->
                    <div class="options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="lembrar"> Lembrar-me
                        </label>
                        <a href="#" onclick="esqueciMinhaSenha(event)">Esqueceu a senha?</a>
                    </div>

                    <!-- Botão de envio (como estava originalmente) -->
                    <input type="submit" value="Entrar como Apoiadora">
                </form>

                <!-- Redes sociais -->
                <div class="social">
                    <span>Siga:</span>
                    <a href="https://www.instagram.com/mmaiabrasil/" target="_blank">@mmaiabrasil</a>
                </div>

                <!-- Rodapé -->
                <footer>
                    © 2026 Maia - Todos os direitos reservados
                </footer>
            </div>
        </div>
    </div>

    <!-- Script específico da Rede de Apoio -->
    <script src="js/login-rede-apoio.js"></script>

</body>

</html>
