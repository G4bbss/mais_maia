<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em construção - Rede de Apoio Materno</title>
    <link rel="icon" href="img/maiaFavicon.png" type="image/png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(to right, #f5ebe0, #e6ccb2);
            color: #4a3c31;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }

        .cartao {
            background-color: #fffaf6;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
            padding: 50px 40px;
            max-width: 420px;
        }

        .cartao .emoji {
            font-size: 42px;
            margin-bottom: 16px;
        }

        .cartao h2 {
            color: #7f5539;
            margin-bottom: 10px;
        }

        .cartao p {
            font-size: 14px;
            color: #6b5744;
            margin-bottom: 26px;
        }

        .cartao a {
            display: inline-block;
            background-color: #7f5539;
            color: #fff;
            font-weight: bold;
            padding: 12px 26px;
            border-radius: 6px;
            text-decoration: none;
        }

        .cartao a:hover {
            background-color: #9c6644;
        }
    </style>
</head>

<body>
    <div class="cartao">
        <div class="emoji">🚧</div>
        <h2>Essa área está a caminho</h2>
        <p>Estamos preparando essa funcionalidade com todo o cuidado que você merece. Em breve ela estará disponível
            por aqui.</p>
        <a href="/dashboard">Voltar ao painel</a>
    </div>
</body>

</html>
